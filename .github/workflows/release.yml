name: Release binaries

# Builds Linux x86_64 and aarch64 binaries, AppImages, .deb and .rpm packages,
# plus a native Arch Linux .pkg.tar.zst package (x86_64), tests the packages in
# clean Fedora, Ubuntu and Arch containers, generates unified SHA256SUMS, and
# attaches everything to the GitHub Release.
# Runs on every pushed version tag, or by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v1.3.0), or a branch for a rehearsal"
        required: true
      publish:
        description: "Upload to the release (off = build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc keeps the x86_64 binary runnable on more distros.
          - arch: x86_64
            runner: ubuntu-22.04
            build_arch_pkg: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build_arch_pkg: false
    env:
      # Passed through env, never interpolated into scripts.
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Packaging files (icon, desktop entry) and the package test script from
      # this workflow's own commit, so building an older tag by hand still
      # gets them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: pkg
          sparse-checkout: |
            packaging
            scripts

      - name: Version check
        # Every format is built from this one commit; refuse to publish if the
        # tag and the version inside the code disagree.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml version: $version, tag: $TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$TAG" == v* && "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
          if [ -x scripts/release.sh ]; then
            scripts/release.sh check
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools (prebuilt)
        uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Ensure packaging tools are installed
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/pova --version

      - name: Package tarball
        run: |
          mkdir -p dist
          name="pova-${TAG}-${ARCH}-linux"
          mkdir -p "$name"
          cp target/release/pova README.md LICENSE THIRD_PARTY_NOTICES.md "$name/"
          mkdir -p "$name/scripts" && cp scripts/import-cookie.sh "$name/scripts/"
          tar czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Build AppImage
        # pova still uses the system's mpv, yt-dlp and pipewire-utils; the
        # AppImage carries pova itself, its icon and a desktop entry.
        run: |
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          a=AppDir
          rm -rf "$a"
          mkdir -p $a/usr/bin $a/usr/share/applications $a/usr/share/icons/hicolor/512x512/apps
          cp target/release/pova $a/usr/bin/
          cp pkg/packaging/appimage/pova.desktop $a/
          cp pkg/packaging/appimage/pova.desktop $a/usr/share/applications/
          cp pkg/packaging/appimage/pova.png $a/
          cp pkg/packaging/appimage/pova.png $a/usr/share/icons/hicolor/512x512/apps/
          ln -s pova.png $a/.DirIcon
          ln -s usr/bin/pova $a/AppRun
          appimage="pova-${TAG}-${ARCH}.AppImage"
          ARCH="$ARCH" ./appimagetool --appimage-extract-and-run "$a" "dist/$appimage"
          ./"dist/$appimage" --appimage-extract-and-run --version
          (cd dist && sha256sum "$appimage" > "$appimage.sha256")
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"

      - name: Build .deb and .rpm
        run: |
          cargo deb --no-build --no-strip
          cargo generate-rpm
          deb=$(ls target/debian/*.deb) && rpm=$(ls target/generate-rpm/*.rpm)
          cp "$deb" "$rpm" dist/
          deb=$(basename "$deb") && rpm=$(basename "$rpm")
          (cd dist && sha256sum "$deb" > "$deb.sha256" && sha256sum "$rpm" > "$rpm.sha256")
          echo "DEB=$deb" >> "$GITHUB_ENV" && echo "RPM=$rpm" >> "$GITHUB_ENV"

      # Install each package on a clean system: proves its dependencies resolve
      # from the distro's own repositories and that everything lands in place.
      - name: Test the .rpm on Fedora
        run: pkg/scripts/test-packages.sh rpm "dist/$RPM" fedora:latest

      - name: Test the .deb on Ubuntu
        run: pkg/scripts/test-packages.sh deb "dist/$DEB" ubuntu:24.04

      - name: Build Arch Linux .pkg.tar.zst
        if: matrix.build_arch_pkg
        run: |
          rm -rf arch-work arch-out
          mkdir -p arch-work arch-out
          cp packaging/aur/pova-bin/PKGBUILD arch-work/PKGBUILD
          cp "dist/${ASSET}.tar.gz" "arch-work/pova-v${VERSION}-x86_64-linux.tar.gz"
          cp pkg/packaging/appimage/pova.desktop "arch-work/pova-${VERSION}.desktop"
          cp pkg/packaging/appimage/pova.png "arch-work/pova-${VERSION}.png"
          python3 - arch-work/PKGBUILD << 'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(
              r"source=\([^)]*\)",
              'source=(\n  "pova-v${pkgver}-x86_64-linux.tar.gz"\n  "pova-${pkgver}.desktop"\n  "pova-${pkgver}.png"\n)',
              s,
              count=1,
          )
          s = re.sub(r"sha256sums=\([^)]*\)", "sha256sums=('SKIP' 'SKIP' 'SKIP')", s, count=1)
          open(p, "w").write(s)
          PY
          chmod 777 arch-out
          docker run --rm \
            -v "$PWD/arch-work:/src:ro" \
            -v "$PWD/arch-out:/out" \
            archlinux:latest bash -euc '
              pacman -Syu --noconfirm --needed base-devel > /dev/null
              useradd -m builder
              install -d -o builder -g builder /home/builder/build
              cp /src/* /home/builder/build/
              chown -R builder:builder /home/builder/build
              su - builder -c "cd /home/builder/build && makepkg -f --nodeps --skipchecksums"
              cp /home/builder/build/pova-bin-*.pkg.tar.zst /out/
            '
          arch_pkg=$(ls arch-out/pova-bin-*.pkg.tar.zst)
          cp "$arch_pkg" dist/
          arch_pkg=$(basename "$arch_pkg")
          (cd dist && sha256sum "$arch_pkg" > "$arch_pkg.sha256")
          echo "ARCH_PKG=$arch_pkg" >> "$GITHUB_ENV"

      - name: Test the Arch package on Arch Linux
        if: matrix.build_arch_pkg
        run: |
          docker run --rm -v "$PWD/dist:/w:ro" -e ARCH_PKG="$ARCH_PKG" archlinux:latest bash -euc '
            pacman -Syu --noconfirm > /dev/null
            pacman -U --noconfirm "/w/$ARCH_PKG" > /dev/null
            pova --version
            for c in pova-import-cookie mpv yt-dlp pw-record pw-dump; do command -v "$c"; done
            test -f /usr/share/applications/pova.desktop
            echo "== ok: arch pkg on archlinux:latest"
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist/
          retention-days: 3

  publish:
    name: publish release
    needs: [build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          (
            cd dist
            rm -f SHA256SUMS
            find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' \
              | sort \
              | xargs sha256sum > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Prepare release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          repo="${GITHUB_REPOSITORY}"
          owner="${repo%%/*}"
          python3 - "$version" "$TAG" "$repo" "$owner" << 'PY' > release-notes.md
          import re, sys
          version, tag, repo, owner = sys.argv[1:5]
          changelog = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=\n## |\Z)", changelog, re.M | re.S)
          notes = m.group(1).strip() if m else ""
          if notes:
              print(notes)
              print()
          print("## Quick install")
          print()
          print("### One-line installer (auto-detects distro and architecture)")
          print("```sh")
          print(f"curl -fsSL https://raw.githubusercontent.com/{repo}/main/scripts/install.sh | bash")
          print("```")
          print()
          print("### Debian / Ubuntu (signed apt repository, amd64 & arm64)")
          print("```sh")
          print("sudo install -d -m 0755 /etc/apt/keyrings")
          print(f"curl -fsSL https://{owner}.github.io/pova/apt/pova.gpg | sudo tee /etc/apt/keyrings/pova.gpg > /dev/null")
          print(f'echo "deb [signed-by=/etc/apt/keyrings/pova.gpg] https://{owner}.github.io/pova/apt stable main" | sudo tee /etc/apt/sources.list.d/pova.list')
          print("sudo apt update && sudo apt install pova")
          print("```")
          print()
          print("### Direct package installs")
          print("```sh")
          print(f"# Fedora / RHEL (.rpm)")
          print(f"sudo dnf install https://github.com/{repo}/releases/download/{tag}/pova-{version}-1.x86_64.rpm")
          print()
          print(f"# Debian / Ubuntu (.deb)")
          print(f"curl -LO https://github.com/{repo}/releases/download/{tag}/pova_{version}-1_amd64.deb")
          print(f"sudo apt install ./pova_{version}-1_amd64.deb")
          print()
          print(f"# Arch Linux (.pkg.tar.zst)")
          print(f"curl -LO https://github.com/{repo}/releases/download/{tag}/pova-bin-{version}-1-x86_64.pkg.tar.zst")
          print(f"sudo pacman -U ./pova-bin-{version}-1-x86_64.pkg.tar.zst")
          print()
          print(f"# Nix / NixOS")
          print(f"nix run github:{repo}/{tag}")
          print("```")
          print()
          print("ARM64 (`aarch64` / `arm64`) `.deb`, `.rpm`, `.AppImage`, and `.tar.gz` assets are attached below alongside `SHA256SUMS`.")
          PY
          cat release-notes.md

      - name: Upload to the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "pova $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "pova $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Publish to crates.io
        # Same commit as the binaries above. Needs a CARGO_REGISTRY_TOKEN repo
        # secret; without it this step only says so.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret; skipping crates.io publish."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -fsS -A "pova-release-ci" "https://crates.io/api/v1/crates/pova/$version" > /dev/null 2>&1; then
            echo "pova $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked --allow-dirty   # CI build outputs sit in the checkout
